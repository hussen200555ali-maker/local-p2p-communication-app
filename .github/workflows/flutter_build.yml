name: Build APK and Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Git symlinks
        run: |
          git config --global core.symlinks true
          git config core.symlinks true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Replace plugin symlinks with copies
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $symlinkDir = "windows/flutter/ephemeral/.plugin_symlinks"
          if (Test-Path $symlinkDir) {
            Get-ChildItem -Path $symlinkDir -Directory | ForEach-Object {
              $linkPath = $_.FullName
              $name = $_.Name
              try {
                $item = Get-Item $linkPath -Force
                if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
                  $target = $item.Target
                  if (-not $target) {
                    $target = $item.ResolvedTarget
                  }
                  if (-not $target) {
                    $out = cmd /c "fsutil reparsepoint query `"$linkPath`"" 2>&1
                  }
                  $source = $null
                  if ($target) {
                    $source = $target
                  } else {
                    $pubCache = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
                    $srcDir = Get-ChildItem -Path $pubCache -Directory -Filter "$name-*" | Sort-Object Name -Descending | Select-Object -First 1
                    if ($srcDir) { $source = $srcDir.FullName }
                  }
                  if ($source -and (Test-Path $source)) {
                    Write-Host "Converting symlink to copy: $name"
                    cmd /c "rmdir /s /q `"$linkPath`"" 2>$null
                    Remove-Item $linkPath -Force -Recurse -ErrorAction SilentlyContinue
                    New-Item -ItemType Directory -Path $linkPath -Force | Out-Null
                    Copy-Item -Path "$source\*" -Destination $linkPath -Recurse -Force
                  }
                }
              } catch {}
            }
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip Windows build
        if: success()
        run: |
          if (Test-Path "build/windows/x64/runner/Release") {
            Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Alshami-Windows.zip" -Force
          } else {
            Write-Error "مجلد الإخراج غير موجود، فشل البناء"
            exit 1
          }

      - name: Upload Windows Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Alshami-Windows
          path: Alshami-Windows.zip
