name: local_social_app
description: "تطبيق تواصل اجتماعي محلي يعمل بدون إنترنت"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  shared_preferences: ^2.2.2
  network_info_plus: ^7.0.0
  local_auth: ^2.3.0
  image_picker: ^1.0.4
  intl: ^0.20.2
  path_provider: ^2.1.1
  path: ^1.9.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  uuid: ^4.4.0
  provider: ^6.1.1
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.3.0
  permission_handler: ^12.0.1
  flutter_webrtc: ^1.2.0
  file_picker: ^10.3.3
  badges: ^3.1.2
  open_filex: ^4.4.0
  audioplayers: ^6.0.0
  vibration: ^3.1.4
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# إعدادات flutter_native_splash توضع خارج قسم flutter
flutter_native_splash:
  color: "#075E54"
  image: assets/images/splash.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  adaptive_icon_background: "#075E54"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
